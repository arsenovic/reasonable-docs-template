# Build the docs on every push and pull request, and publish them on GitHub Pages from main.
# Turn Pages on first: Settings > Pages > Source: GitHub Actions.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: reasonable-docs-template
      # Until shibuya-page is on PyPI, pyproject.toml finds it beside this repo.
      - uses: actions/checkout@v4
        with:
          repository: arsenovic/shibuya-page
          path: shibuya-page
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - run: just docs
        working-directory: reasonable-docs-template
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reasonable-docs-template/docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
